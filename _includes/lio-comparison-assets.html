<style>

  @media (prefers-reduced-motion: reduce) {
    .lio-comparison .lio-cloud {
      display: none;
    }
  }
</style>

<script>
(() => {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  document.querySelectorAll(".lio-comparison").forEach((root) => {
    const c = root.querySelector(".lio-cloud");
    if (!c) return;

    const ctx = c.getContext("2d");
    let w;
    let h;
    let pts = [];
    let raf;
    let sweep = 0;

    function resize() {
      const hero = c.parentElement;
      w = c.width = hero.offsetWidth;
      h = c.height = hero.offsetHeight;
      const count = Math.min(110, Math.floor((w * h) / 11000));
      pts = [];
      for (let i = 0; i < count; i += 1) {
        pts.push({
          x: Math.random() * w,
          y: Math.random() * h,
          z: Math.random() * 0.8 + 0.2,
          vx: (Math.random() - 0.5) * 0.18,
          vy: (Math.random() - 0.5) * 0.12
        });
      }
    }

    function draw() {
      ctx.clearRect(0, 0, w, h);
      sweep += 0.0016;
      const sx = (Math.sin(sweep) * 0.5 + 0.5) * w;
      const grad = ctx.createLinearGradient(sx - 90, 0, sx + 90, 0);
      grad.addColorStop(0, "rgba(11,99,206,0)");
      grad.addColorStop(0.5, "rgba(11,99,206,0.08)");
      grad.addColorStop(1, "rgba(11,99,206,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(sx - 90, 0, 180, h);

      for (let i = 0; i < pts.length; i += 1) {
        const p = pts[i];
        p.x += p.vx;
        p.y += p.vy;
        if (p.x < 0) p.x = w;
        if (p.x > w) p.x = 0;
        if (p.y < 0) p.y = h;
        if (p.y > h) p.y = 0;

        const near = 1 - Math.min(1, Math.abs(p.x - sx) / 120);
        const r = p.z * 1.5 + near * 1.2;
        const a = 0.20 * p.z + near * 0.42;
        ctx.beginPath();
        ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(11,99,206,${a})`;
        ctx.fill();

        for (let j = i + 1; j < pts.length; j += 1) {
          const q = pts[j];
          const dx = p.x - q.x;
          const dy = p.y - q.y;
          const d = dx * dx + dy * dy;
          if (d < 6400) {
            ctx.strokeStyle = `rgba(11,99,206,${0.06 * (1 - d / 6400)})`;
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(q.x, q.y);
            ctx.stroke();
          }
        }
      }

      raf = requestAnimationFrame(draw);
    }

    resize();
    draw();
    window.addEventListener("resize", () => {
      cancelAnimationFrame(raf);
      resize();
      draw();
    });
  });
})();
</script>
