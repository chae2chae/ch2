research_summary: >
  장기 manipulation skill을 학습하고, 구조화되지 않은 실제 환경에서도 안정적으로 동작하는 로봇을 만드는 것을 목표로 연구합니다.
  주요 관심사는 robotic manipulation을 위한 imitation learning과 vision-language-action model이며, 물리 로봇에 multimodal policy를 배포하고
  closed-loop real-robot trial을 통해 강건성을 검증한 경험이 있습니다. 최근에는 demonstration 의존도를 줄이고 일반화 성능을 높이기 위해
  foundation model 기반 reward/value learning으로 연구를 확장하고 있습니다.

focus:
  - Imitation Learning
  - Vision-Language-Action Models
  - Real-Robot Manipulation
  - Closed-Loop Deployment
  - Foundation-Model Rewards
  - Embodied AI

research_highlights:
  - title: Simulation이 아닌 실제 로봇에서의 IL
    summary: Binary visual mask prior를 결합한 ACT 기반 behavior cloning policy인 MaskACT를 설계하고 검증하여, 1시간 teleoperation demonstration 기준 real-robot flower thinning 성공률을 40%에서 62%로 개선했습니다.
  - title: End-to-end IL pipeline ownership
    summary: Teleoperation rig, dataset curation, training, closed-loop deployment까지 전체 pipeline을 구축하고 운영했습니다.
  - title: 다양한 manipulation platform 경험
    summary: AI-Worker, Piper, xArm7, UR3/UR5, RB5-850e, 4-Finger Gripper (SNU)에서 학습 기반 및 classical policy를 배포했습니다.
  - title: 현재 연구 방향
    summary: Single-arm VLA를 bimanual setup으로 확장하고, GR00T-N1.5 통합 및 foundation model 기반 reward/value learning을 탐색하고 있습니다.

experience:
  - organization: Metafarmers Inc.
    role: Researcher
    period: 2025.03 - 2026.05
    summary: Imitation learning 기반 자율 flower thinning system의 lead developer.
    details:
      - Single-arm에서 bimanual extension까지 imitation learning 기반 자율 flower thinning system 개발을 주도했습니다.
      - VLA/IL policy 설계, teleoperation data 수집, training, real-robot evaluation을 담당했습니다.
      - GR00T-N1.5 등 foundation model 통합과 multi-flower environment를 위한 Real2Sim2Real pipeline을 탐색했습니다.
  - organization: Korea Electronics Technology Institute (KETI)
    role: Researcher
    period: 2024.09 - 2024.12
    summary: 가혹 환경용 3D collaborative teleoperation system의 full system integration을 수행했습니다.
    details:
      - Camera 기반 gripper teleoperation, object detection/tracking, 3D reconstruction을 통합했습니다.
      - Robotworld 2024 Best Product of the Year를 수상한 시스템 개발에 기여했습니다.
  - organization: Pyloneer Inc.
    role: AI/IoT Researcher
    period: 2023.06 - 2024.08
    summary: 실제 sensor data 기반 charging system 및 time-series anomaly detection model을 개발했습니다.
    details:
      - ESP32 기반 EV charging system의 hardware design, KC certification, 2개 testbed 19대 deployment를 수행했습니다.
      - 공정 장비 current data를 위한 clustering 및 auto-encoder 기반 anomaly detection model을 구축했습니다.
      - Lithium-ion battery thermal runaway early-detection experiment를 설계했습니다.
  - organization: KITECH AI Robot Lab
    role: Student Researcher
    period: 2021.03 - 2023.02
    summary: Mobile robot을 위한 learning 및 perception system을 개발했습니다.
    details:
      - 석사 연구로 dynamic environment에서 mobile robot pedestrian avoidance를 위한 deep-RL 기반 방법을 개발했습니다.
      - Outdoor autonomous public-service robot에서 LiDAR-camera social-distance recognition과 YOLOv5 기반 15-class object recognition 및 auto-labeling을 수행했습니다.
  - organization: SFA Engineering Corporation
